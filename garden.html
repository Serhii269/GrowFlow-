<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/garden.css" />
    <link rel="stylesheet" href="styles/garden-view.css" />
    <link rel="icon" type="image/x-icon" href="assets/icons/logo.svg" />
    <title>GrowFlow — Garden</title>
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-top">
          <a href="index.html" class="logo">
            <img
              src="assets/icons/logo.svg"
              alt="logo"
              width="28"
              height="28"
            />
            <span>GrowFlow</span>
          </a>
          <button
            class="new-habit-btn"
            onclick="window.location.href='dashboard.html'"
          >
            <img
              src="assets/icons/nav-plus.svg"
              alt=""
              width="18"
              height="18"
            />
            New Habit
          </button>
        </div>

        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-link">
            <img
              src="assets/icons/nav-dashboard.svg"
              alt=""
              width="18"
              height="18"
            />
            Dashboard
          </a>
          <a href="garden.html" class="nav-link active">
            <img
              src="assets/icons/nav-garden.svg"
              alt=""
              width="18"
              height="18"
            />
            Garden
          </a>
          <a href="focus.html" class="nav-link">
            <img
              src="assets/icons/nav-focus.svg"
              alt=""
              width="18"
              height="18"
            />
            Focus
          </a>
          <a href="ai.html" class="nav-link">
            <img src="assets/icons/nav-ai.svg" alt="" width="18" height="18" />
            AI Assistant
          </a>
        </nav>

        <div
          class="sidebar-user"
          onclick="window.location.href='profile.html'"
          style="cursor: pointer"
        >
          <div class="user-avatar"><span></span></div>
          <div class="user-info">
            <p class="user-name"></p>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <div class="page-header">
          <div>
            <h1>My Garden</h1>
            <p>Your habits growing in real time</p>
          </div>
          <div class="garden-legend">
            <span class="legend-item legend-healthy">Thriving</span>
            <span class="legend-item legend-growing">Growing</span>
            <span class="legend-item legend-wilting">Needs attention</span>
          </div>
        </div>

        <div class="garden-grid" id="garden-grid"></div>
      </main>
    </div>

    <div class="modal-overlay" id="plant-modal">
      <div class="plant-modal-inner">
        <button class="modal-close" id="close-plant-modal">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
            <path
              d="M1 1l8 8M9 1L1 9"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </button>

        <div class="plant-modal-visual">
          <img id="modal-plant-img" src="" alt="" width="160" height="160" />
        </div>

        <div class="plant-modal-info">
          <p class="plant-modal-stage" id="modal-stage">Stage 1 of 4</p>
          <h2 id="modal-plant-name">Oak</h2>
          <p class="plant-modal-habit" id="modal-habit-name">Read 10 pages</p>

          <div class="plant-modal-stats">
            <div class="plant-modal-stat">
              <span>Completions</span>
              <p id="modal-completions">0</p>
            </div>
            <div class="plant-modal-stat">
              <span>Growth</span>
              <p id="modal-pct">0%</p>
            </div>
            <div class="plant-modal-stat">
              <span>Deadline</span>
              <p id="modal-deadline">—</p>
            </div>
          </div>

          <div class="plant-modal-progress">
            <div class="plant-progress-bar">
              <div class="plant-progress-fill" id="modal-progress-fill"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/garden-view.js"></script>
  </body>
</html>
